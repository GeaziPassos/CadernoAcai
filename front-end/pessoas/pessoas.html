<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CadernoAçaí</title>
    <link rel="stylesheet" href="site.css">
</head>
<body>

    <aside class="sidebar">

        <div class="logo">
            Caderno<span>Açaí</span>
        </div>

        <nav>
            <a href="escala.html">
                <span class="icone">📅</span>
                Escala
            </a>

            <a href="maquinas.html">
                <span class="icone">⚙️</span>
                Máquinas
            </a>

            <a href="pessoas.html" class="ativo">
                <span class="icone">👥</span>
                Pessoas
            </a>

            <a href="produtos.html">
                <span class="icone">📦</span>
                Produtos
            </a>
        </nav>

    </aside>

    <main class="conteudo">

        <header class="topbar">
            <strong>Caderno<span>Açaí</span></strong>
            <span class="breadcrumb">· Pessoas</span>
        </header>

        <section class="pagina">

            <div class="titulo-pagina">
                <h2>Pessoas</h2>

                <button id="btn-cadastrar">
                    + Nova pessoa
                </button>

                <dialog id="modal-cadastro">
                    <h2>Cadastrar pessoa</h2>

                    <form id="form-cadastro">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" required />

                        <button type="submit">Salvar</button>
                        <button type="button" id="btn-cancelar">Cancelar</button>
                    </form>
                </dialog>
            </div>

            <div class="painel">

                <div class="painel-topo">
                    <div>
                        <h3>Equipe</h3>

                        <p>
                            Cadastre e organize as pessoas da equipe
                            e suas duplas de trabalho.
                        </p>
                    </div>

                    <span class="contador">
                       
                    </span>
                </div>

                <input
                    type="search"
                    class="pesquisa"
                    placeholder="Buscar por nome..."
                >

                <div class="tabela-container">

                    <table>

                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Duplas</th>
                                <th>Status</th>
                            </tr>
                        </thead> 

                        <tbody id="tabela">

                        </tbody>
                
                    </table>
                
                </div>

            </div>

        </section>

    </main>

</body>

<script type="module" src="./pessoasScript/index.ts"></script>

</html>
